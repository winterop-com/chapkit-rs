name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (includes the HTTP contract and the OpenAPI drift check)
        run: cargo test --workspace
      - name: Test on the turso backend
        run: make test-turso
      - name: Lint and test the polars conversion
        run: make test-polars

  scaffold:
    name: chapkit-rs init builds and passes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the command
        run: cargo build --release -p chapkit-cli
      - name: Create a package against this checkout
        run: target/release/chapkit-rs init ci-model --dir "$RUNNER_TEMP/ci-model" --chapkit-path .
      - name: Test the package
        working-directory: ${{ runner.temp }}/ci-model
        run: cargo test
      - name: Serve it and run chap-core's flow against it
        working-directory: ${{ runner.temp }}/ci-model
        run: |
          cargo build --release
          target/release/ci-model serve --port 8000 &
          for _ in $(seq 1 50); do curl -sf localhost:8000/health && break; sleep 0.2; done
          "$GITHUB_WORKSPACE/target/release/chapkit-rs" test
          target/release/ci-model test --port 8000

  ui:
    name: The web UI builds from source to the committed build
    runs-on: ubuntu-24.04
    # sokkel-ui comes from GitHub Packages; the job's token reads it once the package grants this
    # repository Actions access (the package's settings, Manage Actions access).
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - name: Install (frozen lockfile), lint, test and build
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ui
      - name: The committed build is a build of the source
        run: |
          changed=$(git status --porcelain -- crates/chapkit-ui/dist)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "::error::crates/chapkit-ui/dist differs from a build of ui/: run make ui and commit the result"
            exit 1
          fi

  docs:
    name: Build the book
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: mdbook build docs
