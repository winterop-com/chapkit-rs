[package]
name = "chapkit"
description = "In-process ML services for Chap, wire-compatible with Python chapkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chapkit-core.workspace = true
chapkit-dataframe.workspace = true
chapkit-http.workspace = true
chapkit-flow.workspace = true
chapkit-store.workspace = true
chapkit-xai.workspace = true
chapkit-eval.workspace = true
chapkit-ts.workspace = true
chapkit-hpo.workspace = true
chapkit-ui = { workspace = true, optional = true }
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
ulid.workspace = true
lru.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
clap = { workspace = true, features = ["env", "string"] }

# musl's allocator is slow under multithreading (rayon); static musl builds (the Docker image) use mimalloc.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
axum.workspace = true
clap.workspace = true
http-body-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower.workspace = true
ulid.workspace = true
criterion.workspace = true

[[bench]]
name = "predict_splits"
harness = false

[features]
default = ["ui"]
# The web UI at /ui/ (crates/chapkit-ui), and / redirected to it.
ui = ["dep:chapkit-ui"]
# turso storage backend (DATABASE_URL=turso:///path).
turso = ["chapkit-store/turso"]
# DataFrame::to_polars / from_polars, and chapkit::polars re-exported.
polars = ["chapkit-dataframe/polars"]

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Morten Hansen <morten@winterop.com>"]
publish = false

[workspace.dependencies]
chapkit-dataframe = { path = "crates/chapkit-dataframe" }
polars = { version = "0.55", default-features = false }
chapkit-core = { path = "crates/chapkit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
schemars = "1"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
safetensors = "0.8"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ulid = { version = "3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http-body-util = "0.1"
lru = "0.16"
rayon = "1"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
chapkit-xai = { path = "crates/chapkit-xai" }
chapkit-eval = { path = "crates/chapkit-eval" }
chapkit-ts = { path = "crates/chapkit-ts" }
chapkit-hpo = { path = "crates/chapkit-hpo" }
chapkit-ui = { path = "crates/chapkit-ui" }
rust-embed = { version = "8.13", features = ["debug-embed", "mime-guess"] }
async-trait = "0.1"
futures-util = "0.3"
turso = { version = "0.8.3", default-features = false }
gethostname = "1"
chapkit-http = { path = "crates/chapkit-http" }
chapkit-store = { path = "crates/chapkit-store" }
chapkit-flow = { path = "crates/chapkit-flow" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
result_large_err = "allow"
many_single_char_names = "allow"

# The numeric code (ARIMA likelihoods, STL) runs slowly unoptimised; tests use it heavily.
[profile.dev.package.chapkit-ts]
opt-level = 3

[profile.bench]
debug = true

[profile.release]
strip = true
lto = "thin"
