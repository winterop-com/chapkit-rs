[package]
name = "chapkit"
description = "In-process ML services for Chap, wire-compatible with Python chapkit"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chapkit-core.workspace = true
chapkit-dataframe.workspace = true
chapkit-http.workspace = true
chapkit-store.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
ulid.workspace = true
lru.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/*", "examples/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Morten Hansen <morten@winterop.com>"]
publish = false

[workspace.dependencies]
chapkit-dataframe = { path = "crates/chapkit-dataframe" }
chapkit-core = { path = "crates/chapkit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
schemars = "1"
rand = { version = "0.9", features = ["small_rng"] }
rand_distr = "0.5"
safetensors = "0.8"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
utoipa = { version = "6", features = ["axum_extras"] }
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }
rusqlite = { version = "0.41", features = ["bundled"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
ulid = { version = "3", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
http-body-util = "0.1"
lru = "0.16"
async-trait = "0.1"
gethostname = "1"
chapkit-http = { path = "crates/chapkit-http" }
chapkit-store = { path = "crates/chapkit-store" }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
doc_markdown = "allow"
result_large_err = "allow"

[profile.bench]
debug = true
