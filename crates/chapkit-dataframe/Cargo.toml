[package]
name = "chapkit-dataframe"
description = "Lightweight columnar DataFrame with the chapkit {columns, data} JSON wire format"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Optional conversion to and from polars (to_polars / from_polars).
polars = { workspace = true, optional = true }

[features]
polars = ["dep:polars"]

[dev-dependencies]
criterion.workspace = true
polars = { workspace = true, features = ["lazy"] }

[[bench]]
name = "codec"
harness = false

[lints]
workspace = true
