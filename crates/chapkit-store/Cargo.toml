[package]
name = "chapkit-store"
description = "Persistence for chapkit-rs: configs, artifacts and their links behind an async Store trait (SQLite backend)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
async-trait.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
turso = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true

[features]
default = []
# Store backend on turso, a Rust reimplementation of SQLite (same file format).
turso = ["dep:turso"]

[lints]
workspace = true
